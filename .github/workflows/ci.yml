name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install browser for visual tests
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify source, API docs, tests, builds, docs, and package
        run: pnpm verify

      - name: Ensure build does not modify tracked files
        run: git diff --exit-code

      - name: Upload visual test failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AI evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-results
          path: .ai-eval-results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
